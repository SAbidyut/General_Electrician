<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="568" viewBox="0 0 1240 568"><rect width="1240" height="568" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">লোডের ধরন অনুযায়ী একই কন্টাক্টরের রেটিং</text><rect x="46.0" y="92.0" width="1148.0" height="366.0" rx="13" fill="#FCFDFE" stroke="#C3CEDA" stroke-width="1.8"/><rect x="493.5" y="104.0" width="253.0" height="39.9" rx="9" fill="#1D5B8F" stroke="#1D5B8F" stroke-width="1.8"/><text x="620.0" y="130.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3RT2016: 400 V-এ রেটিং</text><text x="354.0" y="184.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#1B6E47" text-anchor="end">AC-1</text><text x="354.0" y="214.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="end">রেজিস্টিভ: হিটার, ফার্নেস</text><rect x="380.0" y="154.0" width="700.0" height="46.0" rx="6" fill="#F3F6F9" stroke="#C3CEDA" stroke-width="1.6"/><rect x="380.0" y="154.0" width="581.1" height="46.0" rx="6" fill="#EAF6EF" stroke="#1B6E47" stroke-width="2.6"/><text x="977.1" y="185.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#1B6E47" text-anchor="start">22 A</text><text x="354.0" y="280.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#B47500" text-anchor="end">AC-3</text><text x="354.0" y="310.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="end">মোটর চালু ও বন্ধ</text><rect x="380.0" y="250.0" width="700.0" height="46.0" rx="6" fill="#F3F6F9" stroke="#C3CEDA" stroke-width="1.6"/><rect x="380.0" y="250.0" width="237.7" height="46.0" rx="6" fill="#FFF6E5" stroke="#B47500" stroke-width="2.6"/><text x="633.7" y="281.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#B47500" text-anchor="start">9 A</text><text x="354.0" y="376.0" font-family="Kalpurush" font-size="24