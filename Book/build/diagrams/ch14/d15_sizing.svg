<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762"><rect width="1240" height="762" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">কোন কন্টাক্টরে কত কারেন্ট যায়</text><rect x="46.0" y="124.0" width="272.0" height="206.0" rx="12" fill="#FCFDFE" stroke="#1B6E47" stroke-width="2.6"/><rect x="119.3" y="138.0" width="125.4" height="37.9" rx="9" fill="#1B6E47" stroke="#1B6E47" stroke-width="1.8"/><text x="182.0" y="163.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">KM1 লাইন</text><text x="182.0" y="251.7" font-family="Kalpurush" font-size="34" font-weight="700" fill="#1B6E47" text-anchor="middle">0.58 × In</text><text x="182.0" y="300.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">ডেল্টায় কয়েলের কারেন্ট</text><rect x="352.0" y="124.0" width="272.0" height="206.0" rx="12" fill="#FCFDFE" stroke="#1D6FA8" stroke-width="2.6"/><rect x="419.7" y="138.0" width="136.6" height="37.9" rx="9" fill="#1D6FA8" stroke="#1D6FA8" stroke-width="1.8"/><text x="488.0" y="163.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">KM2 স্টার</text><text x="488.0" y="251.7" font-family="Kalpurush" font-size="34" font-weight="700" fill="#1D6FA8" text-anchor="middle">0.33 × In</text><text x="488.0" y="300.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">স্টারের লাইন কারেন্ট</text><rect x="658.0" y="124.0" width="272.0" height="206.0" rx="12" fill="#FCFDFE" stroke="#B5541F" stroke-width="2.6"/><rect x="720.1" y="138.0" width="147.8" height="37.9" rx="9" fill="#B5541F" stroke="#B5541F" stroke-width="1.8"/><text x="794.0" y="163.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">KM3 ডেল্টা</text><text x="794.0" y="251.7" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B5541F" text-anchor="middle">0.58 × In</text><text x="794.0" y="300.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">ডেল্টায় কয়েলের কারেন্ট</text><rect x="964.0" y="124.0" width="272.0" height="206.0" rx="12" fill="#FCFDFE" stroke="#B47500" stroke-width="2.6"/><rect x="1037.3" y="138.0" width="125.4" height="37.9" rx="9" fill="#B47500" stroke="#B47500" stroke-width="1.8"/><text x="1100.0" y="163.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">F2 সেটিং</text><text x="1100.0" y="251.7" font-family="Kalpurush" font-size="34" font-weight="700" fill="#B47500" text-anchor="middle">0.58 × In</text><text x="1100.0" y="300.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">কয়েলের কারেন্টে সেট</text><rect x="46.0" y="374.0" width="1148.0" height="186.0" rx="12" fill="#F3F7FB" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="414.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">উদাহরণ: 15 kW মোটর, নেমপ্লেটে In = 30 A</text><text x="180.0" y="462.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#1B6E47" text-anchor="middle">KM1</text><text x="180.0" y="500.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">30 × 0.58 = 17.4 A</text><text x="180.0" y="532.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">বাজারে 18 A</text><text x="470.0" y="462.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#1D6FA8" text-anchor="middle">KM2</text><text x="470.0" y="500.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">30 / 3 = 10 A</text><text x="470.0" y="532.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">বাজারে 12 A</text><text x="760.0" y="462.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#B5541F" text-anchor="middle">KM3</text><text x="760.0" y="500.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">30 × 0.58 = 17.4 A</text><text x="760.0" y="532.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">বাজারে 18 A</text><text x="1050.0" y="462.0" font-family="Kalpurush" font-size="21.5" font-weight="700" fill="#B47500" text-anchor="middle">F2</text><text x="1050.0" y="500.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">সেট করুন 17.4 A</text><text x="1050.0" y="532.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">পরিসর 13–19 A</text><text x="620.0" y="610.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">তিনটির কোনোটিই পুরো 30 A-এর নয়। DOL স্টার্টারে একটি কন্টাক্টর লাগে,</text><text x="620.0" y="644.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#5A6470" text-anchor="middle">কিন্তু সেটি পুরো 30 A-এর। তাই তিনটি ছোট কন্টাক্টরের দাম তিন গুণ হয় না।</text><rect x="46.0" y="680.0" width="1148.0" height="58.0" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="716.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">0.58 আসে 1 / 1.73 থেকে, আর 0.33 আসে 0.58 / 1.73 থেকে</text></svg>