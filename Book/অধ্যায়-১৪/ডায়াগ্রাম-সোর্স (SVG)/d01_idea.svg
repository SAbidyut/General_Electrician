<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660"><rect width="1240" height="660" fill="#FFFFFF"/><text x="620.0" y="48.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#0F3357" text-anchor="middle">বড় মোটর সরাসরি চালু করলে যা ঘটে</text><rect x="46.0" y="132.0" width="366.0" height="300.0" rx="13" fill="#FCFDFE" stroke="#1D5B8F" stroke-width="2.4"/><rect x="110.8" y="148.0" width="236.3" height="39.9" rx="9" fill="#1D5B8F" stroke="#1D5B8F" stroke-width="1.8"/><text x="229.0" y="174.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">লাইনের ভোল্টেজ পড়ে যায়</text><text x="229.0" y="282.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">একই ট্রান্সফরমারের অন্য সব বাতি</text><text x="229.0" y="322.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">এক পলকের জন্য নিভু নিভু</text><text x="229.0" y="386.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#E7EDF3" text-anchor="middle">১</text><rect x="438.0" y="132.0" width="366.0" height="300.0" rx="13" fill="#FCFDFE" stroke="#B47500" stroke-width="2.4"/><rect x="513.9" y="148.0" width="214.2" height="39.9" rx="9" fill="#B47500" stroke="#B47500" stroke-width="1.8"/><text x="621.0" y="174.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">তার ও ব্রেকার বড় লাগে</text><text x="621.0" y="282.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">স্টার্টিং কারেন্ট ৬–৭ গুণ,</text><text x="621.0" y="322.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">ব্রেকার বারবার ট্রিপ করে</text><text x="621.0" y="386.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#E7EDF3" text-anchor="middle">২</text><rect x="830.0" y="132.0" width="366.0" height="300.0" rx="13" fill="#FCFDFE" stroke="#B32A22" stroke-width="2.4"/><rect x="931.5" y="148.0" width="163.0" height="39.9" rx="9" fill="#B32A22" stroke="#B32A22" stroke-width="1.8"/><text x="1013.0" y="174.2" font-family="Kalpurush" font-size="21.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">যন্ত্রে ঝাঁকুনি লাগে</text><text x="1013.0" y="282.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">বেল্ট পিছলায়, কাপলিং খোলে,</text><text x="1013.0" y="322.0" font-family="Kalpurush" font-size="20" font-weight="400" fill="#0F3357" text-anchor="middle">গিয়ারবক্স ক্ষয়ে যায়</text><text x="1013.0" y="386.0" font-family="Kalpurush" font-size="34" font-weight="700" fill="#E7EDF3" text-anchor="middle">৩</text><text x="620.0" y="500.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">সমাধান — চালুর সময়টুকুতে কয়েলে কম ভোল্টেজ দাও, গতি উঠলে পুরো ভোল্টেজ</text><text x="620.0" y="542.0" font-family="Kalpurush" font-size="21.5" font-weight="400" fill="#5A6470" text-anchor="middle">স্টার-ডেল্টা স্টার্টার ঠিক এই কাজটাই করে — মোটরের সংযোগ বদলে</text><rect x="46.0" y="578.0" width="1148.0" height="58.0" rx="11" fill="#EAF2FA" stroke="#1D5B8F" stroke-width="2"/><text x="620.0" y="614.0" font-family="Kalpurush" font-size="24.5" font-weight="700" fill="#0F3357" text-anchor="middle">চালুর সময় কারেন্ট কমাতে হলে টর্কও কমবে — এই দুটো একসঙ্গে চলে, আলাদা করা যায় না</text></svg>